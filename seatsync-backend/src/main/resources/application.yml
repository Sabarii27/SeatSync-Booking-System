server:
  port: 8080

spring:
  application:
    name: seatsync-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:seatsync}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # fine for a portfolio project; use Flyway/Liquibase in production
    properties:
      hibernate.format_sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: "false"
        max.block.ms: "3000"
    consumer:
      group-id: seatsync-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.sabari.seatsync.kafka.BookingEvent
        spring.json.trusted.packages: com.sabari.seatsync.kafka
        spring.json.use.type.headers: "false"

seatsync:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-this-secret-must-be-at-least-32-bytes}
    expiration-ms: 86400000
  hold-minutes: 5
  hold-cleanup-interval-ms: 30000
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  kafka:
    topic: booking-events
  seed:
    enabled: true
  admin:            # LOCAL DEVELOPMENT ONLY defaults
    email: ${ADMIN_EMAIL:admin@seatsync.local}
    password: ${ADMIN_PASSWORD:Admin@123}

logging:
  level:
    com.sabari.seatsync: INFO
